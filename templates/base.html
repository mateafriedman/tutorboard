<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tutoring Appointment Board{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('index') }}" class="brand">Tutoring Board</a>
    <a href="{{ url_for('add') }}" class="btn btn-primary">+ Add session</a>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    Running on <strong>{{ app_env }}</strong> &middot; Data: {{ db_label }} &middot; All records are fictitious
  </footer>
</body>
</html>
